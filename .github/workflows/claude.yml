name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract effort level from issue body
        id: effort
        run: |
          # Safely read issue body from the GitHub event payload (avoids shell injection from backticks)
          EFFORT=$(jq -r '.issue.body // .comment.body // ""' "$GITHUB_EVENT_PATH" | grep -oiE '\*\*Effort:\*\*[[:space:]]*(Low|Medium|High)' | grep -oiE 'low|medium|high' | head -1 || true)
          EFFORT=$(echo "${EFFORT:-high}" | tr '[:upper:]' '[:lower:]')
          echo "level=$EFFORT" >> $GITHUB_OUTPUT
          echo "Detected effort level: $EFFORT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--model opus --allowed-tools Bash(gh pr:*)'
          # Temporarily enabled to verify effort level is being applied
          show_full_output: true
        env:
          CLAUDE_CODE_EFFORT_LEVEL: ${{ steps.effort.outputs.level }}
